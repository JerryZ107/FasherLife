<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3a2614" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="钓鱼佬" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>钓鱼佬日常 · Demo</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var box = document.createElement("div");
        box.id = "err-box";
        box.style.cssText =
          "position:fixed;top:0;left:0;right:0;max-height:50vh;overflow:auto;z-index:9999;" +
          "background:#1a0f14;color:#ef476f;padding:12px;font-family:monospace;white-space:pre-wrap;display:none";
        document.body.appendChild(box);
        function show(msg) {
          box.style.display = "block";
          box.textContent += msg + "\n\n";
        }
        window.addEventListener("error", function (e) {
          show("ERROR: " + (e.message || "") + "\n" + (e.error && e.error.stack ? e.error.stack : ""));
        });
        window.addEventListener("unhandledrejection", function (e) {
          show("PROMISE: " + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
